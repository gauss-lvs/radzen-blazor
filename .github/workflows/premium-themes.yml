name: Premium themes

# Im GAUSS-Fork deaktiviert: der push-Trigger wuerde bei jeder Theme-Aenderung
# einen Build in radzenhq/radzen-next anstossen. Die Datei bleibt liegen, damit
# upstream-Merges sie nicht immer wieder zurueckbringen.
on:
  workflow_dispatch:

jobs:
  dispatch:
    name: Trigger the premium themes build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to radzen-next
        env:
          GH_TOKEN: ${{ secrets.THEMES_DISPATCH_TOKEN }}
        run: gh api repos/radzenhq/radzen-next/dispatches -f event_type=premium-themes
