# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# Im GAUSS-Fork deaktiviert: gebaut und veroeffentlicht wird ueber
# .forgejo/workflows/release.yml auf git.gauss-lvs.de. Die push- und
# pull_request-Trigger sind entfernt, damit hier nichts automatisch startet;
# die Datei bleibt liegen, damit upstream-Merges sie nicht immer wieder
# zurueckbringen.
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    
    - name: Build
      run: dotnet build Radzen.Blazor/Radzen.Blazor.csproj
    - name: Test
      run: dotnet test Radzen.Blazor.Tests/Radzen.Blazor.Tests.csproj
